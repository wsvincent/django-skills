name: Link Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch external documentation links that have rotted.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal:
    name: Internal links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python scripts/check_links.py

  external:
    name: External URLs
    # Network-dependent, so it never blocks a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --accept 200,206,429
            --max-retries 3
            --exclude-path .claude
            './**/*.md'
          fail: true
